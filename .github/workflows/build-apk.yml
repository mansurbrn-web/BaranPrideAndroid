name: Build BARAN PRIDE V3.1 LIVE APK

'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract configured V3.1 project
        run: |
          unzip -q BaranPride_V3_1_LIVE.zip
          test -f BaranPrideAndroid/app/build.gradle.kts
          test -f BaranPrideAndroid/app/src/main/assets/js/config.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('BaranPrideAndroid/app/src/main/assets/js/config.js')
          s = p.read_text(encoding='utf-8')
          assert all(x in s for x in ('apiKey:', 'projectId:', 'appId:')), 'Missing Firebase config fields'
          assert 'apiKey: ""' not in s and 'projectId: ""' not in s and 'appId: ""' not in s, 'Firebase config is still blank'
          print('Firebase app config: present (values not printed).')
          PY

      - name: Build Android Debug APK
        working-directory: BaranPrideAndroid
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaranPride-V3.1-LIVE-APK
          path: BaranPrideAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
