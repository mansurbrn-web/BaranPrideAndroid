
name: Build BARAN PRIDE APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Project
        run: unzip -q Baran_Pride_Android_App_Source_Admin_Panel.zip

      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        working-directory: BaranPrideAndroid
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaranPride-APK
          path: BaranPrideAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
