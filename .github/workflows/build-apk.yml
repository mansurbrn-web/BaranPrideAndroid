name: Build BARAN PRIDE V1.0 Updated APK
'on':
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Updated Project ZIP
        shell: bash
        run: |
          set -euo pipefail
          FILE="BaranPride_V1_0_UPDATED_SOURCE.zip"
          test -s "$FILE" || { echo "Missing $FILE"; exit 1; }
          unzip -t "$FILE" >/dev/null
          unzip -q "$FILE"
          test -f BaranPrideAndroid/app/build.gradle.kts
          test -f BaranPrideAndroid/app/src/main/assets/js/app.js
      - name: Build Android Test APK
        working-directory: BaranPrideAndroid
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BaranPride-V1.0-Updated-Test-APK
          path: BaranPrideAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
